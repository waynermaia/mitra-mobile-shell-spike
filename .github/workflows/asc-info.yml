name: ASC tools

# Diagnostics and small TestFlight chores against App Store Connect: what the API returns for an
# app (record, builds, groups) and, when build and group are given, add that build to the group.

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Bundle id to inspect"
        type: string
        required: true
      build:
        description: "Build number to add to a TestFlight group (with group)"
        type: string
        default: ""
      group:
        description: "TestFlight group name (with build)"
        type: string
        default: ""
      copy_testers_from:
        description: "Bundle id whose internal TestFlight testers are copied to bundle_id"
        type: string
        default: ""
      expire:
        description: "Build number to expire in TestFlight"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  tools:
    runs-on:
      group: mitra-delivery
      labels: mitra-delivery
    environment: stores
    env:
      BUNDLE_ID: ${{ inputs.bundle_id }}
      BUILD: ${{ inputs.build }}
      GROUP: ${{ inputs.group }}
      EXPIRE: ${{ inputs.expire }}
      COPY_FROM: ${{ inputs.copy_testers_from }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: 22
      - name: Info
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
        run: node generator/asc.mjs info --bundle-id "$BUNDLE_ID"
      - name: Builds
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
        run: node generator/asc.mjs builds --bundle-id "$BUNDLE_ID"
      - name: Add the build to the group
        if: ${{ inputs.build != '' && inputs.group != '' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
        run: node generator/asc.mjs add-to-group --bundle-id "$BUNDLE_ID" --build "$BUILD" --group "$GROUP"
      - name: Expire the build
        if: ${{ inputs.expire != '' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
        run: node generator/asc.mjs expire-build --bundle-id "$BUNDLE_ID" --build "$EXPIRE"
      - name: Copy the internal testers
        if: ${{ inputs.copy_testers_from != '' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
        run: node generator/asc.mjs copy-internal-testers --bundle-id "$BUNDLE_ID" --from "$COPY_FROM"
